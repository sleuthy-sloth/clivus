name: windows-app

# Manual only. Compiles the Qt GUI with MSVC so MSVC-only breakage (Qt/DCMTK/Windows headers) shows up
# without a Windows machine. A hosted runner has no GPU, so this says nothing about fps — that needs a
# real desktop, see docs/windows.md.
on:
  workflow_dispatch:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Enable vcpkg manifest mode
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-app-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The point of this job: a runnable folder to copy to any borrowed Windows machine, so verifying
      # the port never needs a toolchain (or a purchase) on that machine.
      - name: Package runnable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Get-ChildItem -Recurse -Filter clivus.exe build | Select-Object -First 1).FullName
          Copy-Item $exe dist\clivus.exe
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler dist\clivus.exe
          Get-ChildItem "build\vcpkg_installed\x64-windows\bin\*.dll" | Copy-Item -Destination dist
          Copy-Item -Recurse testdata\corpus dist\corpus
          Copy-Item docs\windows.md dist\READ-ME-FIRST.md
          Get-ChildItem dist | Format-Table Name, Length

      # Informational: a hosted runner has no GPU, so this proves the binary loads and the canvas can
      # create a context under software GL, not that it is fast.
      - name: Smoke run (software GL, no GPU here)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_OPENGL = 'software'
          & .\dist\clivus.exe .\dist\corpus --bench 20 2>&1 | Tee-Object -FilePath bench.txt
          Get-Content bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: clivus-windows-x64
          path: dist
          retention-days: 14
