name: windows

# Core library + pixel-math tests only. Qt is not installed here: a vcpkg qtbase
# build takes well over an hour on a hosted runner, so the GUI is built locally
# until there is a Windows desktop or a self-hosted runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable vcpkg manifest mode
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DHW_BUILD_APP=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
