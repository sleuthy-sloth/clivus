name: windows

# Core library + pixel-math tests only. Qt is not installed here: a vcpkg qtbase
# build takes well over an hour on a hosted runner, so the GUI is built locally
# until there is a Windows desktop or a self-hosted runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable vcpkg manifest mode
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # Ninja + the MSVC environment, not the "Visual Studio 17 2022" generator: the hosted image's
      # VS instance is not always discoverable by CMake's VS generator, while cl.exe on PATH is.
      - uses: ilammy/msvc-dev-cmd@v1

      # The pinned builtin-baseline in vcpkg.json can be newer than the vcpkg snapshot baked into the
      # runner image; without this fetch, configure dies with "failed to `git show`
      # versions/baseline.json". Tags-only fetch keeps it cheap.
      - name: Fetch the pinned vcpkg baseline into the runner clone
        shell: pwsh
        run: git -C $env:VCPKG_INSTALLATION_ROOT fetch origin --tags --force --depth=200

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCLIVUS_BUILD_APP=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # What this DCMTK build actually carries. vcpkg's dcmtk[openjpeg] feature is requested in
      # vcpkg.json, but the runtime still reports no JPEG 2000 decoder — this step says whether the
      # module, the header or neither is missing, which decides how J2K gets fixed.
      - name: DCMTK codec modules present
        shell: pwsh
        run: |
          foreach ($n in 'dcmjp2k','dcmjpls','dcmjpeg','dcmtkcharls') {
            $h = Test-Path "build\vcpkg_installed\x64-windows\include\dcmtk\$n"
            $l = (Get-ChildItem "build\vcpkg_installed\x64-windows\lib" -Filter "$n*" -ErrorAction SilentlyContinue | Measure-Object).Count
            $d = (Get-ChildItem "build\vcpkg_installed\x64-windows\bin" -Filter "$n*" -ErrorAction SilentlyContinue | Measure-Object).Count
            "module {0,-14} header={1,-5} libs={2} dlls={3}" -f $n, $h, $l, $d
          }
          "dcmtk version: " + (Get-Content build\vcpkg_installed\vcpkg\info\dcmtk_*.list -TotalCount 1)

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # -V so the decode matrix prints which decoders this DCMTK build carries and whether
        # the JPEG-LS/RLE objects came back pixel-identical, instead of just "Passed".
        run: ctest --test-dir build --output-on-failure -V
